<svg xmlns="http://www.w3.org/2000/svg" width="960" height="508" viewBox="0 0 960 508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect x="0.75" y="0.75" width="958.5" height="506.5" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <text x="40" y="46" font-size="20" font-weight="600" fill="#334155">Two tools, one gate</text>
  <text x="40" y="68" font-size="13" fill="#64748B">Narrow schemas the model cannot misuse, with every request passing the same check</text>

  <!-- Left panel: Chosen -->
  <rect x="32" y="88" width="536" height="260" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="52" y="116" font-size="14" font-weight="600" fill="#15803D">Chosen</text>

  <rect x="52" y="136" width="240" height="60" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
  <text x="172" y="161" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#334155" text-anchor="middle">webSearch</text>
  <text x="172" y="181" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#64748B" text-anchor="middle">{ query: string }</text>

  <rect x="308" y="136" width="240" height="60" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
  <text x="428" y="161" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#334155" text-anchor="middle">webFetch</text>
  <text x="428" y="181" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#64748B" text-anchor="middle">{ url: string, raw?: boolean }</text>

  <line x1="172" y1="196" x2="172" y2="262" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="428" y1="196" x2="428" y2="262" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <rect x="140" y="264" width="320" height="60" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="300" y="289" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1E3A8A" text-anchor="middle">getWebEnv()</text>
  <text x="300" y="309" font-size="13" fill="#334155" text-anchor="middle">Restricted-data gate</text>

  <!-- Right panel: Rejected composite -->
  <rect x="592" y="88" width="336" height="260" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="612" y="116" font-size="14" font-weight="600" fill="#DC2626">Rejected: composite</text>

  <rect x="612" y="136" width="296" height="60" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
  <text x="760" y="161" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#334155" text-anchor="middle">web</text>
  <text x="760" y="181" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#64748B" text-anchor="middle">{ action, query?, url?, raw? }</text>

  <rect x="612" y="264" width="296" height="60" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="760" y="289" font-size="13" fill="#334155" text-anchor="middle">Every field optional;</text>
  <text x="760" y="309" font-size="13" fill="#334155" text-anchor="middle">wrong combinations rejected at runtime</text>

  <!-- Bottom strip: future browser use -->
  <rect x="32" y="368" width="896" height="80" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="52" y="403" font-size="14" font-weight="600" fill="#334155">Future browser use</text>
  <text x="52" y="423" font-size="12" fill="#64748B">Not a tool</text>

  <rect x="240" y="384" width="312" height="48" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="396" y="413" font-size="13" fill="#334155" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" fill="#1E3A8A">executeCode</tspan> capability (a session object)</text>

  <text x="576" y="404" font-size="13" fill="#334155">Stateful, has side effects:</text>
  <text x="576" y="422" font-size="13" fill="#334155">not a one-shot tool action</text>

  <!-- Precedent -->
  <text x="40" y="482" font-size="12" font-weight="600" fill="#64748B">PRECEDENT</text>
  <text x="128" y="482" font-size="13" fill="#334155"><tspan font-weight="600" fill="#15803D">Separate tools:</tspan> Anthropic API, oh-my-pi, Codex.<tspan dx="20" font-weight="600" fill="#DC2626">Composite:</tspan> Kinu.</text>
</svg>
