<svg xmlns="http://www.w3.org/2000/svg" width="960" height="364" viewBox="0 0 960 364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="limit-bar">
      <rect x="40" y="132" width="640" height="48" rx="8"/>
    </clipPath>
  </defs>

  <rect x="0.75" y="0.75" width="958.5" height="362.5" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <text x="40" y="46" font-size="20" font-weight="600" fill="#334155">How results fit</text>
  <text x="40" y="68" font-size="13" fill="#64748B">Whole results while they fit in MAX_TOOL_RESULT_CHARS, then a count of the rest</text>

  <!-- Limit bar: 640px = 32,768 chars; results 1-6 = 31,600 chars -->
  <text x="40" y="112" font-size="14" font-weight="600" fill="#334155">Results 1 to 6: 31,600 chars</text>
  <text x="680" y="112" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#334155" text-anchor="end">MAX_TOOL_RESULT_CHARS = 32,768</text>
  <text x="815" y="112" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle">Left out</text>

  <g clip-path="url(#limit-bar)">
    <rect x="40.00" y="132" width="82.03" height="48" fill="#1D4ED8"/>
    <rect x="122.03" y="132" width="119.14" height="48" fill="#3B82F6"/>
    <rect x="241.17" y="132" width="60.55" height="48" fill="#1D4ED8"/>
    <rect x="301.72" y="132" width="156.25" height="48" fill="#3B82F6"/>
    <rect x="457.97" y="132" width="103.52" height="48" fill="#1D4ED8"/>
    <rect x="561.48" y="132" width="95.70" height="48" fill="#3B82F6"/>
    <rect x="657.19" y="132" width="22.81" height="48" fill="#DCFCE7"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="1">
    <line x1="122.03" y1="132" x2="122.03" y2="180"/>
    <line x1="241.17" y1="132" x2="241.17" y2="180"/>
    <line x1="301.72" y1="132" x2="301.72" y2="180"/>
    <line x1="457.97" y1="132" x2="457.97" y2="180"/>
    <line x1="561.48" y1="132" x2="561.48" y2="180"/>
  </g>
  <rect x="40" y="132" width="640" height="48" rx="8" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="81.02" y="152" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="81.02" y="169" font-size="12" fill="#FFFFFF" text-anchor="middle">4,200</text>
  <text x="181.60" y="152" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="181.60" y="169" font-size="12" fill="#FFFFFF" text-anchor="middle">6,100</text>
  <text x="271.45" y="152" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="271.45" y="169" font-size="12" fill="#FFFFFF" text-anchor="middle">3,100</text>
  <text x="379.84" y="152" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="379.84" y="169" font-size="12" fill="#FFFFFF" text-anchor="middle">8,000</text>
  <text x="509.73" y="152" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="509.73" y="169" font-size="12" fill="#FFFFFF" text-anchor="middle">5,300</text>
  <text x="609.34" y="152" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="609.34" y="169" font-size="12" fill="#FFFFFF" text-anchor="middle">4,900</text>
  <rect x="700" y="132" width="50" height="48" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="725" y="161" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">7</text>
  <rect x="758" y="132" width="50" height="48" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="783" y="161" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">8</text>
  <rect x="816" y="132" width="50" height="48" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="841" y="161" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">9</text>
  <rect x="874" y="132" width="50" height="48" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="899" y="161" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">10</text>

  <g font-size="12" fill="#64748B" text-anchor="middle">
    <text x="40" y="198" text-anchor="start">0</text>
    <text x="680" y="198" text-anchor="end">32,768</text>
  </g>
  <text x="815" y="198" font-size="12" fill="#64748B" text-anchor="middle">result 7 would not fit</text>

  <rect x="40" y="222" width="300" height="44" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <text x="60" y="249" font-size="13" fill="#64748B">Ends with</text>
  <text x="130" y="249" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#334155">(4 more results not shown)</text>

  <line x1="24" y1="300" x2="936" y2="300" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="40" y="330" font-size="13" fill="#334155">Results stay whole and JSON-encoded, so no result is cut and page text cannot pose as structure.</text>
</svg>
